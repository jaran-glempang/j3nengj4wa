<!DOCTYPE html>
<html lang="jv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Panganggit Jeneng</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+Javanese&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f6f5f2;
            --card: #ffffff;
            --panel: #f1efe9;
            --text: #1d1b18;
            --muted: #7a756c;
            --line: #e7e3da;
            --accent: #a8452a;
            --accent-hover: #8f3a22;
            --accent-text: #ffffff;
            --ok: #2f7d4f;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #151412;
                --card: #1e1c19;
                --panel: #26231f;
                --text: #f1eee8;
                --muted: #9a948a;
                --line: #33302b;
                --accent: #d9694a;
                --accent-hover: #e57d60;
                --accent-text: #1a0f0a;
                --ok: #5fbf85;
            }
        }
        :root[data-theme="dark"] {
            --bg: #151412;
            --card: #1e1c19;
            --panel: #26231f;
            --text: #f1eee8;
            --muted: #9a948a;
            --line: #33302b;
            --accent: #d9694a;
            --accent-hover: #e57d60;
            --accent-text: #1a0f0a;
            --ok: #5fbf85;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html { scroll-padding-top: env(safe-area-inset-top, 0px); }

        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .kartu {
            background: var(--card);
            width: 100%;
            max-width: 480px;
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 2rem 1.75rem 1.5rem;
            box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 12px 32px rgba(0,0,0,0.06);
        }

        @media (max-width: 480px) {
            body { padding: 1rem 0.75rem; }
            .kartu { padding: 1.5rem 1.25rem 1.25rem; border-radius: 16px; }
        }

        .isi { position: relative; }

        .aksara-jawa {
            text-align: center;
            font-size: 1.5rem;
            color: var(--accent);
            opacity: 0.85;
            margin-bottom: 0.75rem;
            font-family: 'Noto Serif Javanese', serif;
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            letter-spacing: -0.02em;
            margin-bottom: 0.25rem;
        }

        .subjudul {
            font-size: 0.875rem;
            color: var(--muted);
            text-align: center;
            margin-bottom: 1.5rem;
        }

        #result-container {
            background: var(--panel);
            border-radius: 14px;
            height: 180px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.25rem 1.25rem;
            margin-bottom: 1rem;
        }

        .label-hasil {
            font-size: 0.675rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 0.5rem;
        }

        #result {
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: -0.02em;
            color: var(--text);
            text-align: center;
            line-height: 1.25;
            word-break: break-word;
            white-space: nowrap;
            width: 100%;
            overflow: hidden;
            transition: font-size 0.2s, opacity 0.3s;
        }

        #result.flash { animation: kilat 0.35s ease; }

        @keyframes kilat {
            0% { opacity: 0; transform: translateY(6px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        #sandhi-badge {
            display: none;
            margin-top: 0.6rem;
            font-size: 0.775rem;
            color: var(--muted);
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 3px 12px;
        }

        .tombol-wrapper {
            display: flex;
            gap: 0.6rem;
            margin-bottom: 1.5rem;
        }

        button {
            flex: 1;
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            padding: 0.85rem 1rem;
            border-radius: 12px;
            border: 1px solid transparent;
            transition: background 0.15s, transform 0.1s, color 0.15s, border-color 0.15s;
        }

        #btn-generate {
            background: var(--accent);
            color: var(--accent-text);
            flex: 1.6;
        }
        #btn-generate:hover { background: var(--accent-hover); }
        #btn-generate:active { transform: scale(0.98); }

        #btn-salin {
            background: transparent;
            color: var(--text);
            border-color: var(--line);
            flex: 0.7;
        }
        #btn-salin:hover { background: var(--panel); }
        #btn-salin:active { transform: scale(0.98); }
        #btn-salin.tersalin {
            color: var(--ok);
            border-color: var(--ok);
        }

        .riwayat-label {
            font-size: 0.675rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 0.6rem;
        }

        #riwayat {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 32px 32px;
            gap: 0.4rem;
            height: calc(32px * 2 + 0.4rem);
        }

        .riwayat-item {
            font-size: 0.8rem;
            color: var(--text);
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 0 12px;
            height: 32px;
            line-height: 30px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }
        .riwayat-item:hover { border-color: var(--accent); }

        .garis-footer {
            height: 1px;
            background: var(--line);
            margin: 1.5rem 0 1rem;
        }

        .footer-note {
            text-align: center;
            font-size: 0.75rem;
            color: var(--muted);
        }
        .footer-note a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }
        .footer-note a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="kartu">
    <div class="isi">
        <div class="aksara-jawa">ꦥꦔꦁꦒꦶꦠ꧀ꦗꦼꦤꦼꦁ</div>

        <h2>Panganggit Jeneng</h2>
        <div class="subjudul">Generate Javanese family names</div>

        <div id="result-container">
            <div class="label-hasil">Asmanipun</div>
            <div id="result">— — —</div>
            <div id="sandhi-badge"></div>
        </div>

        <div class="tombol-wrapper">
            <button id="btn-generate" onclick="generateName()">Generate Name</button>
            <button id="btn-salin" onclick="salinNama()">Salin</button>
        </div>

        <div class="riwayat-label">Cathetaning Asma</div>
        <div id="riwayat"></div>

        <div class="garis-footer"></div>
        <div class="footer-note">Ginawe dening <a href="https://x.com/NetflixJW" target="_blank">@NetflixJW</a></div>
    </div>
</div>

<script>
    const namaDepan = ["mangun","selo","mangku","wojo","jayeng","ambar","udoko","warso","setyo","padmo","wukir","warih","mloyo","durmo","wresni","wedyo","wignyo","pujo","puji","puspo","sastro","pringgo","citro","sekar","ranu","danu","aryo","arum","tirto","suryo","santa","karto","wigyo","suro","ronggo","sasro","purwo","cokro","lembu","paku","bayu","noto","wrekso","sindu","yoso","sudiro","prayu","cipto","hadi","haryo","pramu","pamong","sani","narto","broto","marto","jati","midera","dirgo","jiwa","joyo","tejo","pandu","atmo","wiro","dipo","purbo","kresno","merto","cahyo","wongso","yomo","panoto","rekso","gondo","darko","hando","bodro","arung","prawoto","projo","darmo","budi","wondo","brojo","wisetro","condro","jogo","mego","kawi","trenggono","layang"];

    const namaBelakang = ["atmojo","switang","prasto","sroyo","kumitir","rejo","setyoko","sambodro","sudiro","wimbo","durmo","marmo","suwarno","jayadi","karyono","setyaki","sasono","margongso","gati","negari","kusumo","sentiko","sumantri","saroso","husodo","aji","nirmolo","wiyatno","wiguno","kinanthi","asmoro","dikromo","wiloso","nugroho","wiyarti","ningrum","ningtyas","mentaram","dipuro","pasuti","tenoyo","prati","dati","darsono","anggoro","utomo","utami","wiratmo","wirono","sadewo","negaran","tyaso","pradoto","pawitro","pasuwiryo","musthiko","suyatno","sangkoyo","sarsadi","puspito","sugondo","suwanto","dirjo","darmo","suroto","yudo","pratomo","wening","lesmi","binang","wijoyo","darmojo","waluyo","suwiryo","gayatri","retno","winoto","sumantro","pranoto","amiseno","laksito","sumarto","wigati","priansari","wijatmoko","lastri","wanto","martono","dono","wardono","somo","widagdo","waskito","warsito","mudyo","winangun","alam","digdo","waseso","wiryo","setro","wardoyo","dilogo","kuncoro","karyo","projo","wibowo","hadi","siswo","amijoyo","direjo","yuwono","loyo","suwandito","siwojo","padmoyo","hantoro","darmanto","mono","yumono","nolo","dibyo","sudibyo","harjo","purwoko","sudarto","miharjo","winarso","wihastuti","diwijo","wilojo","santi","seto","seno","kartiyoso","prawoto","sayekti","legowo","guritno","handoyo","tomo","pambudi","suroso","jayeku","rukmi","noyo","menduran"];

    let riwayat = [];
    let namaTerakhir = '';

    function capitalize(str) {
        return str.charAt(0).toUpperCase() + str.slice(1).toLowerCase();
    }

    function fitFontSize(el) {
        // Izinkan wrap ke 2 baris — font tidak akan terlalu kecil di mobile
        el.style.whiteSpace = 'normal';
        el.style.wordBreak = 'break-word';

        const len = el.innerText.length;
        if (len <= 15)      el.style.fontSize = '1.5rem';
        else if (len <= 20) el.style.fontSize = '1.25rem';
        else                el.style.fontSize = '1.05rem';
    }

    function generateName() {
        let d = namaDepan[Math.floor(Math.random() * namaDepan.length)];
        let b = namaBelakang[Math.floor(Math.random() * namaBelakang.length)];

        let namaAsli = capitalize(d + b);
        let finalDisplay = namaAsli;
        let sandhi = '';

        let dLast = d.charAt(d.length - 1);
        let bFirst = b.charAt(0);

        if ((dLast === 'o' && bFirst === 'a') ||
            (dLast === 'a' && bFirst === 'a') ||
            (dLast === 'a' && bFirst === 'i') ||
            (dLast === 'o' && bFirst === 'u') ||
            (dLast === 'i' && bFirst === 'a')) {
            let namaSandhi = capitalize(d.slice(0, -1) + b);
            finalDisplay = namaAsli;
            sandhi = 'ugi saged: ' + namaSandhi;
        }

        namaTerakhir = finalDisplay;

        const resultDiv = document.getElementById('result');
        const sandhiBadge = document.getElementById('sandhi-badge');

        resultDiv.classList.remove('flash');
        void resultDiv.offsetWidth;
        resultDiv.classList.add('flash');

        resultDiv.innerText = finalDisplay;
        fitFontSize(resultDiv);

        if (sandhi) {
            sandhiBadge.style.display = 'block';
            sandhiBadge.innerText = sandhi;
        } else {
            sandhiBadge.style.display = 'none';
        }

        if (!riwayat.includes(finalDisplay)) {
            riwayat.unshift(finalDisplay);
            if (riwayat.length > 4) riwayat.pop();
            renderRiwayat();
        }
    }

    function renderRiwayat() {
        const el = document.getElementById('riwayat');
        el.innerHTML = riwayat.map(n =>
            `<span class="riwayat-item" onclick="pakaiNama('${n}')">${n}</span>`
        ).join('');
    }

    function pakaiNama(nama) {
        namaTerakhir = nama;
        const resultDiv = document.getElementById('result');
        resultDiv.classList.remove('flash');
        void resultDiv.offsetWidth;
        resultDiv.classList.add('flash');
        resultDiv.innerText = nama;
        fitFontSize(resultDiv);
        document.getElementById('sandhi-badge').style.display = 'none';
    }

    function salinNama() {
        if (!namaTerakhir || namaTerakhir === '— — —') return;
        navigator.clipboard.writeText(namaTerakhir).then(() => {
            const btn = document.getElementById('btn-salin');
            btn.innerText = '✓ Kasalin';
            btn.classList.add('tersalin');
            setTimeout(() => {
                btn.innerText = 'Salin';
                btn.classList.remove('tersalin');
            }, 1500);
        });
    }

    document.addEventListener('keydown', e => {
        if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
            e.preventDefault();
            generateName();
        }
    });
</script>

</body>
</html>
